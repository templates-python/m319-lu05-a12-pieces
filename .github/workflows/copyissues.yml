name: Copy Issues from Source Repo

# Liegt im Template/Starter-Repo, aus dem GitHub Classroom die Schüler-Repos
# erzeugt (Datei unter .github/workflows/copy-issues.yml einfügen). Läuft
# automatisch beim ersten Push, mit dem Classroom das neue Repo befüllt
# (erkannt über github.event.created), und lässt sich zusätzlich jederzeit
# manuell über "Actions" -> "Copy Issues from Source Repo" -> "Run workflow"
# erneut auslösen.
#
# WICHTIG: DEFAULT_SOURCE_REPO unten auf das öffentliche Quell-Repo anpassen,
# aus dem die Issues kopiert werden sollen. Für das Source-Repo wird kein
# Token benötigt, da es public ist.

on:
  push:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source-Repo im Format owner/name (leer lassen = DEFAULT_SOURCE_REPO verwenden)"
        required: false
      state:
        description: "Welche Issues kopiert werden sollen (leer lassen = DEFAULT_STATE verwenden)"
        required: false
        type: choice
        options:
          - ""
          - all
          - open
          - closed

env:
  # Fallback-Werte für den automatischen Lauf beim Repo-Erstellen (Push-Event
  # hat keine workflow_dispatch-Inputs). Bitte DEFAULT_SOURCE_REPO anpassen.
  DEFAULT_SOURCE_REPO: "owner/upstream-repo"
  DEFAULT_STATE: "all"

permissions:
  issues: write
  contents: read

jobs:
  copy-issues:
    # Automatisch nur beim Push, der den Branch/das Repo neu anlegt (Classroom-Setup);
    # manuell jederzeit über workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.created == true
    runs-on: ubuntu-latest
    steps:
      - name: Copy issues from source repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo || env.DEFAULT_SOURCE_REPO }}
          TARGET_REPO: ${{ github.repository }}
          STATE: ${{ inputs.state || env.DEFAULT_STATE }}
        run: |
          set -euo pipefail

          echo "Kopiere Issues von $SOURCE_REPO nach $TARGET_REPO (state: $STATE)"

          # --- 1. Labels aus dem Source-Repo im Target-Repo anlegen, falls sie fehlen ---
          echo "Lese Labels aus $SOURCE_REPO ..."
          gh api "repos/$SOURCE_REPO/labels" --paginate \
            --jq '.[] | [.name, .color, (.description // "")] | @tsv' \
            > /tmp/source_labels.tsv

          mapfile -t existing_labels < <(gh label list --repo "$TARGET_REPO" --limit 1000 --json name --jq '.[].name')

          label_exists() {
            local target="$1"
            for l in "${existing_labels[@]}"; do
              [ "$l" = "$target" ] && return 0
            done
            return 1
          }

          while IFS=$'\t' read -r name color description; do
            [ -z "$name" ] && continue
            if ! label_exists "$name"; then
              echo "Lege Label an: $name"
              gh label create "$name" --repo "$TARGET_REPO" --color "${color:-ededed}" --description "$description" 2>/dev/null || true
              existing_labels+=("$name")
            fi
          done < /tmp/source_labels.tsv

          # --- 2. Issues aus dem Source-Repo laden (Pull Requests ausschliessen) ---
          echo "Lese Issues aus $SOURCE_REPO ..."
          gh api "repos/$SOURCE_REPO/issues" --paginate -f state="$STATE" \
            --jq '.[] | select(.pull_request == null) | {number, title, body, state, labels: [.labels[].name], html_url}' \
            > /tmp/source_issues.jsonl

          count=$(wc -l < /tmp/source_issues.jsonl)
          echo "Gefunden: $count Issues"

          # --- 3. Bereits vorhandene Kopien im Target-Repo einlesen (Duplikat-Schutz) ---
          mapfile -t already_copied < <(
            gh issue list --repo "$TARGET_REPO" --state all --limit 1000 \
              --json body --jq '.[].body' \
            | grep -oE "Source-Issue: [^ ]+#[0-9]+" || true
          )

          was_copied() {
            local ref="Source-Issue: $SOURCE_REPO#$1"
            for c in "${already_copied[@]}"; do
              [ "$c" = "$ref" ] && return 0
            done
            return 1
          }

          # --- 4. Issues im Target-Repo anlegen ---
          while IFS= read -r issue; do
            number=$(echo "$issue" | jq -r '.number')
            title=$(echo "$issue" | jq -r '.title')
            body=$(echo "$issue" | jq -r '.body // ""')
            state=$(echo "$issue" | jq -r '.state')
            url=$(echo "$issue" | jq -r '.html_url')
            mapfile -t labels < <(echo "$issue" | jq -r '.labels[]')

            if was_copied "$number"; then
              echo "Ueberspringe #$number (bereits kopiert)"
              continue
            fi

            marker="Source-Issue: $SOURCE_REPO#$number"
            full_body=$(printf '%s\n\n---\n_Kopiert von %s._\n<!-- %s -->' "$body" "$url" "$marker")

            label_args=()
            for l in "${labels[@]}"; do
              [ -n "$l" ] && label_args+=(--label "$l")
            done

            echo "Erstelle Issue: $title"
            new_url=$(gh issue create --repo "$TARGET_REPO" --title "$title" --body "$full_body" "${label_args[@]}")
            echo "  -> $new_url"

            if [ "$state" = "closed" ]; then
              new_number=$(echo "$new_url" | grep -oE '[0-9]+$')
              gh issue close "$new_number" --repo "$TARGET_REPO" --reason "not planned" || true
            fi
          done < /tmp/source_issues.jsonl

          echo "Fertig."
